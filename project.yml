name: QualDriller
options:
  bundleIdPrefix: com.qualdriller
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  QualDriller:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: QualDriller
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: >-
          QualDriller listens for your spoken replies and detects your shot to stop the timer.
          Audio is processed on this device and never leaves it.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition runs entirely on this device, with no network access, and is used
          only to hear "yes", "no", "repeat command", and "I'm ready".
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.mit.media.freilich.qualdriller
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Set your Apple ID team here, or pick it in Xcode under
        # Signing & Capabilities after the project is generated.
        DEVELOPMENT_TEAM: "K3QS7VFA2Y"
